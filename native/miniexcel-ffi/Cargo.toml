[package]
name = "miniexcel-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native C ABI for MiniExcel .NET interop"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = "0.4.45"
futures-executor = "0.3"
futures-util = "0.3"
miniexcel = { version = "=0.4.0", features = ["async"] }
quick-xml = "0.39.4"
serde_json = "1.0"
tempfile = "3.27.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4.4"
